
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tạp Hóa Tính Xuyên</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      margin: 0;
      padding: 20px;
      text-align: center;
    }
    h1 { color: #166534; }
    .card {
      background: white;
      padding: 24px;
      border-radius: 16px;
      margin: 20px auto;
      max-width: 420px;
    }
    button {
      background: #15803d;
      color: white;
      border: none;
      border-radius: 12px;
      padding: 18px;
      font-size: 20px;
      width: 100%;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>TẠP HÓA TÍNH XUYÊN</h1>
    <p>Phần mềm bán hàng dành cho mẹ</p>
    <h2>HÓA ĐƠN BÁN LẺ</h2>
    <p>Chào mừng đến với cửa hàng!</p>
    <button onclick="alert('Đã chạy thành công!')">
      BẮT ĐẦU BÁN HÀNG
    </button>
  </div>
</body>
</html>
